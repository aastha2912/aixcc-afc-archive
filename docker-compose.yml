services:
  crs-init:
    platform: linux/amd64
    image: ghcr.io/theori-io/crs:${CRS_TAG:-latest}
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - crs-files:/crs

  docker-daemon:
    # run natively on Apple Silicon (arm64)
    platform: linux/arm64
    image: docker:26-dind
    privileged: true
    depends_on:
      - crs-init
    command:
      - --host=tcp://0.0.0.0:2375
      - --tls=false
      - --log-level=warn
      - --storage-driver=overlay2
    tmpfs:
      - /run
      - /tmp
    volumes:
      - crs-files:/crs
      - docker-graph:/var/lib/docker
      - crs-cache:/cache
      - ./utils:/crs/utils:ro          # so DinD can bind into build containers
      # - ./bear:/crs/bear:ro          # uncomment if you use BEAR
    environment:
      - DOCKER_TLS_CERTDIR=
      - DOCKER_TMPDIR=/var/tmp
      - TMPDIR=/var/tmp
    # remove misleading resource flags
    # mem_limit: 80G
    # mem_swappiness: 0

  crs:
    platform: linux/amd64
    image: ghcr.io/theori-io/crs:${CRS_TAG:-latest}
    profiles: [ "none" ]
    privileged: true
    restart: no
    depends_on:
      - docker-daemon
    volumes:
      - crs-files:/crs                 # share the same /crs with DinD
      - ${HOME}/.docker:/root/.docker
      - ./logs:/crs/logs
      - ./configs:/crs/configs
      - ./prompts:/crs/prompts
      - ./tokens_etc:/crs/tokens_etc
      - ./utils:/crs/utils
      - ./crs:/crs/crs
      - crs-cache:/cache
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_API_BASE=${AZURE_API_BASE}
      - AZURE_AI_API_KEY=${AZURE_AI_API_KEY}
      - AZURE_AI_API_BASE=${AZURE_AI_API_BASE}
      - MODEL=${MODEL}
      - MODEL_MAP=/crs/configs/models-openai-simple.toml
      - CACHE_DIR=/cache
      - SILENCE_BUILDS=${SILENCE_BUILDS:-0}
      - DOCKER_HOST=tcp://docker-daemon:2375
      - GIT_DISCOVERY_ACROSS_FILESYSTEM=1

  crs-testing:
    extends: crs
    profiles: [ "test" ]
    environment:
      - LOG_LEVEL=DEBUG
      - PYTEST_ARGS
    volumes:
      - ./projects:/crs/projects
      - ./tests:/crs/tests
      - ./run-tests.sh:/crs/run-tests.sh
    entrypoint: [ "/crs/run-tests.sh" ]

  crs-eval:
    extends: crs
    profiles: [ "eval" ]
    environment:
      - EVAL_ARGS=${EVAL_ARGS}
    volumes:
      - ./projects:/crs/projects
      - ./eval.py:/crs/eval.py
      - ./tests:/crs/tests
      - ./prompts:/crs/prompts
      - ./eval-logs:/crs/eval-logs
      - ./run-evals.sh:/crs/run-evals.sh
    entrypoint: [ "/crs/run-evals.sh" ]

  crs-main:
    platform: linux/amd64
    extends: crs
    profiles: [ "main" ]
    environment:
      - CRS_PORT=${CRS_PORT:-1324}
      - CRS_HOST=0.0.0.0
      - API_KEY_ID=${API_KEY_ID}
      - API_KEY_TOKEN=${API_KEY_TOKEN}
      - CAPI_URL=${CAPI_URL:-http://host.docker.internal:1323}
      - CAPI_ID=${CAPI_ID}
      - CAPI_TOKEN=${CAPI_TOKEN}
      - DOCKER_HOST=tcp://docker-daemon:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - crs-files:/crs                 # share the same /crs with DinD
      - ./data:/crs/data
      - ./projects:/crs/projects
      - ./tests:/crs/tests
      - ./prompts:/crs/prompts
      - ./utils:/crs/utils
      - ./local_files:/crs/local_files
      - ./crs:/crs/crs
      - ./main.py:/crs/main.py
      - ./run-crs.sh:/crs/run-crs.sh
      - ./create_tasks.py:/crs/create_tasks.py
    entrypoint: [ "/crs/run-crs.sh" ]
    ports:
      - "127.0.0.1:${CRS_PORT:-1324}:${CRS_PORT:-1324}"

volumes:
  crs-files:
  docker-graph:
  crs-cache:

name: aixcc-afc-archive
networks:
  default:
    name: aixcc-afc-archive_default
